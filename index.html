<meta charset="utf-8">
<title>Lenda da Luta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: o tatame azul (placas com emendas) é o fundo fixo; cada tela é uma ficha de pesagem sobre o tatame, com um placar de ginásio no topo. Visual único, sem modo escuro. */
:root{
  --mat:#1d4d74; --mat-2:#173f60; --seam:rgba(5,18,33,.34);
  --edge:#b8322c;
  --paper:#f4f6f9; --paper-2:#e3e8ef; --ink:#111a27; --ink-2:#556175; --rule:#cfd6e0;
  --night:#0d1520; --night-2:#182433; --night-ink:#b7c4d4;
  --gold:#e8ad1c; --gold-2:#fff2cc; --red:#c8312b; --up:#1e8a4f; --silver:#a9b4c2; --bronze:#b8743c;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--mat);background-image:linear-gradient(var(--seam) 2px,transparent 2px),linear-gradient(90deg,var(--seam) 2px,transparent 2px);background-size:132px 132px;background-position:-1px -1px;color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
table{border-collapse:collapse;width:100%}
td,th{color:var(--ink);text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:600}
.tbl{overflow-x:auto}

.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:var(--paper);border-bottom:4px solid var(--edge)}
.board-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:900;font-size:25px;letter-spacing:.03em;text-transform:uppercase;line-height:1;background:none;border:0;cursor:pointer;padding:0;color:var(--paper)}
.mark b{color:var(--gold)}
.board-mid{flex:1;display:flex;gap:16px;justify-content:center;font-family:var(--mono);font-size:12.5px;color:var(--night-ink);flex-wrap:wrap;min-width:0}
.board-mid strong{color:var(--paper);font-weight:700}
.board-mid .neg{color:#ff8f86}
.lnk{background:none;border:0;color:var(--night-ink);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.panel{background:var(--paper);color:var(--ink);border-radius:3px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);min-width:0}
.panel.dark{background:var(--night);color:var(--paper)}
.panel.dark td,.panel.dark th{color:var(--paper);border-color:#2b3a4d}
.h{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.015em;font-size:27px;line-height:1;margin:0;text-wrap:balance}
.h-sm{font-size:20px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-2);font-weight:600}
.dark .label{color:var(--night-ink)}
.muted{color:var(--ink-2)}
.dark .muted{color:var(--night-ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.hub{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:16px;align-items:start}
.small{font-size:13px}
.tiny{font-size:12px}
p{margin:0}

.btn{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.04em;padding:10px 22px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);cursor:pointer;line-height:1.05}
.btn:hover{filter:brightness(1.18)}
.btn-gold{background:var(--gold);color:var(--night)}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ghost-l{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper)}
.btn-sm{font-size:16px;padding:7px 13px}
.btn-xs{font-size:14px;padding:5px 10px}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:2px;background:var(--paper-2);color:var(--ink);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;line-height:1.3}
.chip.gold{background:var(--gold);color:var(--night)}
.chip.red{background:var(--red);color:#fff}
.chip.green{background:var(--up);color:#fff}
.chip.ink{background:var(--ink);color:var(--paper)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.cc{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 5px;border-radius:2px;background:var(--ink);color:var(--paper);letter-spacing:.04em}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input{font:inherit;font-size:16px;padding:9px 10px;border:2px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink);min-width:0;width:100%}
.field input:focus{border-color:var(--ink);outline:none}
.seg{display:inline-flex;background:var(--paper-2);border-radius:2px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:2px;cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}

/* home */
.hero{position:relative;padding-block:40px 26px;overflow:hidden}
.hero-tile{position:absolute;right:-40px;top:22px;width:min(380px,60vw);aspect-ratio:1;max-width:100%;background:var(--edge);box-shadow:0 0 0 14px var(--mat-2),0 0 0 16px var(--seam);transform:rotate(8deg);opacity:.9;pointer-events:none}
.hero-tile::before,.hero-tile::after{content:"";position:absolute;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.hero-tile::before{inset:16%;background:rgba(255,255,255,.3)}
.hero-tile::after{inset:calc(16% + 3px);background:var(--edge)}
.hero>*:not(.hero-tile){position:relative}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(68px,15vw,168px);line-height:.8;margin:12px 0 0;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 span{color:var(--gold);display:block}
.hero p.lead{max-width:560px;font-size:18px;margin:18px 0 22px;color:#e6edf5}
.home-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;margin-top:8px;align-items:start}
.steps{display:grid;gap:12px;counter-reset:st}
.steps li{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.steps li::before{counter-increment:st;content:counter(st);font-family:var(--display);font-weight:900;font-size:30px;line-height:1;color:var(--edge)}
.steps ol{margin:0;padding:0}
.artlist{display:grid;gap:9px}
.artrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}

/* cards de escolha */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.picks.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick{border:2px solid var(--rule);background:#fff;border-radius:2px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}
.pick:hover{border-color:var(--ink-2)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--gold-2)}
.pick .pt{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.plus{color:var(--up);font-weight:600}
.minus{color:var(--red);font-weight:600}

/* faixas */
.belt{display:inline-block;width:46px;height:12px;border-radius:2px;background:var(--c,#eee);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);position:relative;flex:none;vertical-align:middle}
.belt::after{content:"";position:absolute;right:7px;top:0;bottom:0;width:11px;background:var(--tip,#111)}
.belt.k{border-radius:6px}
.belt.k::after{display:none}
.belt.k.kp::after{display:block;right:0;width:40%;border-radius:0 6px 6px 0}
.pips{display:inline-flex;gap:3px;vertical-align:middle;flex:none}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink-2)}
.pips i.on{background:var(--gold);box-shadow:inset 0 0 0 1px var(--night)}

/* atributos */
.attrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 18px}
.grp{grid-column:1/-1;margin-top:6px}
.abar{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.atrack{height:9px;background:var(--paper-2);position:relative;border-radius:1px;overflow:hidden}
.atrack i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.atrack b{position:absolute;top:0;bottom:0;background:var(--gold)}
.av{text-align:right;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:8px;margin-right:5px;background:var(--ink)}
.legend span.bf::before{background:var(--gold)}
.ovr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ovr div{background:var(--paper-2);padding:6px 4px;text-align:center;border-radius:2px}
.ovr b{display:block;font-family:var(--mono);font-size:17px}
.ovr span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.ovr .hi{background:var(--ink);color:var(--paper)}
.ovr .hi span{color:var(--night-ink)}

.meter{height:8px;background:var(--paper-2);border-radius:1px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.meter.gold i{background:var(--gold)}
.meter.red i{background:var(--red)}
.meter.green i{background:var(--up)}

/* artes */
.art{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-top:1px solid var(--rule)}
.art:first-of-type{border-top:0}
.art .an{font-weight:700}
.buffs{font-size:12.5px;color:var(--ink-2)}
.buffs b{color:var(--ink)}

/* treino */
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.trow:first-of-type{border-top:0}
.step{display:inline-flex;align-items:center;gap:0;border:2px solid var(--ink);border-radius:2px}
.step button{width:32px;height:30px;border:0;background:#fff;color:var(--ink);cursor:pointer;font-weight:700;font-size:18px;line-height:1}
.step button[disabled]{opacity:.3;cursor:not-allowed}
.step span{min-width:28px;text-align:center;font-family:var(--mono);font-weight:700}
.slots{display:flex;gap:4px}
.slots i{width:22px;height:10px;background:var(--paper-2);border-radius:1px}
.slots i.on{background:var(--ink)}
.money{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13.5px}
.money .tot{font-weight:700;border-top:2px solid var(--ink);padding-top:4px;margin-top:2px}

/* eventos */
.evs{display:grid;gap:8px}
.ev{border:2px solid var(--rule);background:#fff;border-radius:2px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.ev:hover{border-color:var(--ink-2)}
.ev[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--gold-2)}
.ev[disabled]{cursor:not-allowed;opacity:.6;background:var(--paper)}
.ev .et{font-weight:700}
.est{background:var(--night);color:var(--paper);border-radius:2px;padding:14px;display:grid;gap:10px}
.est .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:.9}
.est .label{color:var(--night-ink)}
.advice{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.advice li{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;font-size:13.5px;border-left:3px solid var(--gold);padding-left:9px}
.advice li.good{border-color:var(--up)}
.news{display:grid;gap:6px;font-size:13.5px;max-height:260px;overflow:auto}
.news div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--night);color:var(--night-ink);border:0;padding:8px 14px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.04em;cursor:pointer;border-radius:2px}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.rank{display:grid;gap:2px;font-size:13px}
.rank div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;padding:4px 6px;border-radius:2px}
.rank .me{background:var(--gold);color:var(--night);font-weight:700}
.rank .ch{font-weight:700}
.rank .rv{box-shadow:inset 3px 0 0 var(--red)}

/* luta */
.fight{display:grid;gap:14px;max-width:880px;margin:0 auto}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch;background:var(--night);color:var(--paper);border-radius:3px;padding:14px;border-bottom:4px solid var(--edge)}
.side{display:grid;gap:6px;align-content:start;min-width:0}
.side.o{text-align:right}
.sname{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.smeta{font-size:12px;color:var(--night-ink)}
.spts{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
.mid{display:grid;align-content:center;justify-items:center;gap:6px;text-align:center}
.rd{font-family:var(--mono);font-size:13px;color:var(--night-ink)}
.vs{font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold)}
.bar{display:grid;gap:3px;font-size:11px;color:var(--night-ink);text-transform:uppercase;letter-spacing:.08em}
.bar .meter{background:#263446;height:9px}
.side.o .bar .meter i{left:auto;right:0}
.log{background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 14px;display:grid;gap:5px;max-height:330px;overflow:auto;font-size:14.5px}
.log p.sys{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.log p.me{font-weight:600}
.log p.new{animation:fin .35s ease both}
.log p.res{font-weight:700;color:var(--red)}
@keyframes fin{from{opacity:.15;transform:translateY(4px)}to{opacity:1;transform:none}}
.moment{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px;box-shadow:inset 0 0 0 3px var(--gold);display:grid;gap:12px}
.mctx{font-size:17px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mopt{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;padding:11px 12px;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.mopt:hover{background:var(--gold-2)}
.mopt .ml{font-weight:700;font-size:15px}
.mopt .mp{font-family:var(--mono);font-weight:700;font-size:20px}
.mopt .meter{grid-column:1/-1}
.mopt .mt{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.banner{border-radius:3px;padding:16px;display:grid;gap:8px;text-align:center}
.banner.w{background:var(--gold);color:var(--night)}
.banner.l{background:var(--red);color:#fff}
.banner.d{background:var(--paper-2);color:var(--ink)}
.banner .h{font-size:40px}

/* resultado e troféus */
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:var(--night);box-shadow:inset 0 0 0 4px rgba(0,0,0,.18);flex:none}
.medal.m0{background:var(--gold)}
.medal.m1{background:var(--silver)}
.medal.m2{background:var(--bronze);color:#fff}
.medal.sm{width:38px;height:38px;font-size:14px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:2px;padding:10px}
.beltico{width:64px;height:30px;border-radius:4px;background:linear-gradient(90deg,#1b1b1b 0 22%,var(--gold) 22% 78%,#1b1b1b 78%);position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.beltico::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;background:#fff3c4;box-shadow:inset 0 0 0 3px #b98600}
.timeline{display:grid;gap:6px;font-size:13.5px}
.timeline div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.leg-h{font-family:var(--display);font-weight:900;font-size:clamp(48px,10vw,96px);text-transform:uppercase;line-height:.85;color:var(--gold)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(6,14,24,.72);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
#modal[hidden]{display:none!important}
.mbox{background:var(--paper);color:var(--ink);border-radius:3px;max-width:620px;width:100%;padding:20px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);border-top:5px solid var(--gold)}
.mbox ul{margin:0;padding-left:18px;display:grid;gap:4px}
.offer{border:2px solid var(--rule);border-radius:2px;padding:12px;display:grid;gap:6px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:2px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .hub,.home-grid,.grid2{grid-template-columns:minmax(0,1fr)}
  .picks,.picks.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ovr{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:520px){
  .attrs{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:minmax(0,1fr)}
  .picks,.picks.six{grid-template-columns:minmax(0,1fr)}
  .sname{font-size:21px}
  .spts{font-size:34px}
  .board-mid{justify-content:flex-start;gap:10px}
  .score{padding:10px;gap:8px}
}
.belt.np::after{display:none}
.belt.sm{width:24px;height:9px}
.belt.sm::after{right:3px;width:6px}
.beltrow{display:flex;gap:3px;flex-wrap:wrap}
details.rules summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
@media (max-width:860px){.col-r{order:-1}}
@media (prefers-reduced-motion:reduce){.log p.new{animation:none}}
</style>

<header class="board"><div class="board-in">
  <button class="mark" data-a="menu" aria-label="Menu inicial">Lenda <b>da Luta</b></button>
  <div class="board-mid" id="board-mid"></div>
  <div id="board-r"></div>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal" hidden></div>

  for(let i=0;i<n;i++){R.xp.push(Math.round(58*Math.pow(f(i),1.3)));R.buff.push(Math.round((o.top||12)*f(i)));

    R.age.push(i===0?0:(o.age?o.age[i]:(i===n-1?(o.ageTop||18):i===n-2?16:0)))}
  return R}

/* dry=true: projeção sem sorteio e sem alterar o atleta (usada nas estimativas e no "ganho previsto") */
function trainCalc(mult,dry){const at=dry?Object.assign({},G.at):G.at,gains={},per={},a=G.idade;
  const am=a<16?1.3:a<19?1.25:a<23?1.1:a<27?.95:a<30?.75:a<33?.5:.3;
  for(const [id,n] of Object.entries(G.plano)){if(!n||id==='trab'||id==='prof'||id==='minha')continue;
    if(id.startsWith('aula_')){const x=id.slice(5);if(!dry&&G.artes[x])G.artes[x].xp+=.3*n;continue}
    const art=id==='prep'?PREP:ARTS[id],tier=id==='prep'?PREPT[G.prepT]:ACAD[G.artes[id].t];per[id]={};
    for(let i=0;i<n;i++){for(const k in art.w){const cap=capOf(k);const room=clamp((cap-at[k])/(cap-15),.03,1.2);
        const g=1.05*art.w[k]*tier.mult*am*room*G.ef*mult*(id==='prep'?1:EST[G.artes[id].est||'pad'].tm)*(id===G.art0?(ORIGENS[G.orig].artMult||1):1)*(dry?1:rnd(.7,1.3));at[k]=Math.min(cap,at[k]+g);gains[k]=(gains[k]||0)+g;per[id][k]=(per[id][k]||0)+g}
      if(!dry&&id!=='prep')G.artes[id].xp+=tier.mult*(a<16?.9:1)*(mult>1.1?1.15:1)*(G.lesao?.4:1)*(id===G.art0?(ORIGENS[G.orig].xpMult||1):1)}}
  if(!dry)for(const k in G.at)G.at[k]=r1(G.at[k]);return {gains,per,at}}
function trainQuarter(mult){return trainCalc(mult,false).gains}
const planMult=()=>(G.ev==='none'?1.25:1)*(G.lesao?.35:1);
const projAt=()=>trainCalc(planMult(),true).at;
function ageing(){const a=G.idade,dec=(k,v)=>{G.at[k]=r1(Math.max(8,G.at[k]-v))};
  if(a<20){const gr={for:.6,car:.3,vel:.2,qx:.25};for(const k in gr)if(G.at[k]<capOf(k))G.at[k]=r1(Math.min(capOf(k),G.at[k]+gr[k]))}
  if(a>=30){const d=.12*(a-29);dec('vel',d);dec('car',d*.8);if(a>=33)dec('for',.1*(a-32));if(a>=32)dec('qx',.15);
    if(a>=35)for(const k of ['soc','chu','cli','esq','que','dqu','con','fin','gua'])dec(k,.06*(a-34))}}
function injure(fonte){const L=pick(LESOES);G.lesao={nome:L.nome,q:L.q,nova:true};
  if(L.perm)for(const k in L.perm)G.at[k]=r1(Math.max(8,G.at[k]+L.perm[k]));
  const custo=700*L.q;G.dinheiro-=custo;news('Lesão '+fonte+': '+L.nome+' ('+L.q+' trimestre'+(L.q>1?'s':'')+' de recuperação, tratamento de '+fmt$(custo)+').');
  return L}
function fixPlan(){const mx=slotsMax();for(const id of Object.keys(G.plano)){
    if(id.startsWith('aula_')){if(!teachLvl(id.slice(5)))delete G.plano[id]}
    else if(id==='minha'){if(!G.minha)delete G.plano.minha}

  if(profOn())G.plano.prof=1;else delete G.plano.prof;

function acadCheck(){if(profOn()&&G.prof.ate>absQ()+1)return;const arts=Object.keys(G.artes).filter(id=>teachLvl(id)===2);if(!arts.length||R()>.22)return;

function injectNpc(id){const ros=G.mma.ros,cand=[];for(let i=3;i<ros.length;i++)if(ros[i]!=='P'&&!isRival(ros[i]))cand.push(i);if(!cand.length)return;

function vacate(msg){const M=G.mma;const tr=G.trof.find(t=>t.t==='belt'&&t.org===M.org&&!t.fim);if(tr)tr.fim=G.ano;M.titulo=null;news(msg)}
function genOffers(){G.ofertas=[];const M=G.mma;if(!M||G.lesao)return;const ros=M.ros,ip=ros.indexOf('P'),cand=new Set();
  if(ip===0){[1,2,3].forEach(i=>cand.add(i))}
  else{if(ip<=2||(ip<=4&&M.streak>=3))cand.add(0);for(let i=Math.max(1,ip-3);i<=Math.min(ros.length-1,ip+2);i++)if(i!==ip)cand.add(i)}
  let arr=[...cand].filter(i=>ros[i]&&ros[i]!=='P'&&G.npcs[ros[i]]);const pickd=[];
  if(arr.includes(0)){pickd.push(0);arr=arr.filter(i=>i!==0)}

function simRoster(){const M=G.mma,ros=M.ros;

function ajudaChance(){const g=G.med.filter(m=>m.place===1&&(G.ano-m.ano)*4<=4).length,md=G.med.filter(m=>m.place<=3&&(G.ano-m.ano)*4<=4).length;

/* academia própria: alunos pagam mensalidade; cresce com fama, títulos e com você dando aula lá */
const MENS_ALUNO=140;
function canOpenAcad(){if(G.minha)return {ok:false,why:'Você já tem academia'};if(G.idade<21)return {ok:false,why:'A partir dos 21 anos'};

function startBout(){const F=G.fight,b=F.bouts[F.bi];
  F.S=boutNew(F.sp,effA(F.sp==='mma'?'mma':''),b.a,{nome:b.o.short,rounds:F.rounds});F.seen=0;F.step++;

function checkBoutEnd(){const F=G.fight,S=F.S;if(!S||!S.end||S.rec)return;

  S.rec=1;onBoutEnd(F,S)}
function onBoutEnd(F,S){const b=F.bouts[F.bi],e=S.end,res=e.win==='P'?'V':e.win==='O'?'D':'E',met=metLabel(e);

  if(res==='V'){if(e.m==='KO'||e.m==='TKO')cr.ko++;if(e.m==='SUB'||e.m==='IPPON'||e.m==='FALL')cr.sub++}

  if((e.m==='KO'||e.m==='TKO')&&res==='D'){G.at.qx=r1(Math.max(10,G.at.qx-1.5));F.koed=true}

function rivalUpdate(o,res,F,S){let rv=o.id?G.rivais.find(r=>r.id===o.id):null;
  if(rv){rv[res==='V'?'v':res==='D'?'d':'e']=(rv[res==='V'?'v':res==='D'?'d':'e']||0)+1;
    news((res==='V'?'Você vence o rival ':res==='D'?'Você perde de novo para o rival ':'Empate com o rival ')+o.nome+'. Confronto: '+rv.v+'-'+rv.d+'.');return}
  const close=res==='V'&&S.end.m!=='KO'&&S.end.m!=='SUB'&&Math.abs(S.P.pts-S.O.pts)<=2&&R()<.25;

function endQuarter(){const rep={t:QN[G.q]+' de '+G.ano,l:[],g:(G.ult&&G.ult.g)||{},fin:G.ult&&G.ult.fin};

  resfim(){if(G.view==='result')endQuarter()},

  patro(d){const p=G.modal;if(!p||p.tipo!=='patro')return;if(d.i!==''&&d.i!=null){const o=p.ofs[+d.i];G.patro={marca:o.marca,valor:o.valor,ate:absQ()+o.dur-1};news(G.nome+' fecha patrocínio com a '+o.marca+'.')}nextModal()},
  acad(d){const p=G.modal;if(!p||p.tipo!=='acad')return;if(d.i!==''&&d.i!=null){const o=p.ofs[+d.i],st=G.artes[p.art];
      G.prof={acad:o.acad,art:p.art,valor:o.valor,ate:absQ()+o.dur-1};st.acad=o.acad;st.t=Math.max(st.t,o.t);fixPlan();
      news(G.nome+' assina contrato de professor de '+ARTS[p.art].nome+': '+o.acad+'.');marco('Contratado como professor de '+ARTS[p.art].nome+': '+o.acad)}nextModal()},
  trocar(d){const st=G.artes[d.art];if(G.view!=='hub'||!st||G.dinheiro<MATRICULA||(profOn()&&G.prof.art===d.art)||absQ()-(st.troca!=null?st.troca:-9)<4)return;G.dinheiro-=MATRICULA;st.est=pickEst(st.est);st.var=estVar(st.est);st.troca=absQ();st.acad=null;st.q=r1(st.q/2);
    news(G.nome+' troca de academia de '+ARTS[d.art].nome+'. Novo mestre: '+EST[st.est].nome.toLowerCase()+'.')},
  equip(d){const p=G.modal;if(!p||p.tipo!=='equip')return;if(d.i!==''&&d.i!=null){const o=p.ofs[+d.i];G.equip={marca:o.marca,valor:o.valor,ate:absQ()+o.dur-1};news(G.nome+' fecha patrocínio de equipamento com a '+o.marca+'.')}nextModal()},
  orcamento(){if(G.view!=='hub')return;for(const id in G.artes){if(!(profOn()&&G.prof.art===id))G.artes[id].t=0}G.prepT=0;
    if(!canAdvance().ok&&travelOf())G.ev='none';let g=0;
    const falta=()=>!canAdvance().ok||G.dinheiro+finance().saldo<0;

    if(canAdvance().ok&&G.dinheiro+finance().saldo<0)UI.toast='Plano ajustado, mas ainda fica negativo: o custo de vida pesa. Dar aulas ou um patrocínio resolvem.';
    if(!canAdvance().ok)UI.toast='Não deu para fechar a conta.'},

  mestre(d){const p=G.modal;if(!p||p.tipo!=='mestre')return;const st=G.artes[p.art],A=ARTS[p.art];G.modal=null;
    if(d.c==='segurar'){st.hold=absQ()+4;news('O mestre segura '+G.nome+' na '+A.ranks[st.r].toLowerCase()+' por mais um ano para somar títulos.')}
    else{const to=d.c==='pular'?p.pulo:p.nx,de=A.ranks[st.r].toLowerCase();st.r=to;st.q=0;st.qr=0;st.var=estVar(st.est);st.xp=Math.max(st.xp,reqOf(p.art).xp[to]);
      marco(A.ranks[to]+' de '+A.nome+(d.c==='pular'&&to>p.nx?' (pulou uma faixa)':''));news(G.nome+' troca a '+de+' pela '+A.ranks[to].toLowerCase()+' de '+A.nome+'.')}nextModal()},
  abrirAcad(){const c=canOpenAcad();if(G.view!=='hub'||G.modal||!c.ok)return;G.modal={tipo:'nova',art:c.arts[0],nome:'Team '+G.nome.split(' ').pop()}},
  acadArt(d){if(G.modal&&G.modal.tipo==='nova'){const i=document.getElementById('f-acad');if(i)G.modal.nome=i.value;G.modal.art=d.art}},
  novaAcad(d){const m=G.modal;if(!m||m.tipo!=='nova')return;const i=document.getElementById('f-acad');const nome=((i&&i.value)||m.nome||'').trim()||'Team '+G.nome.split(' ').pop();G.modal=null;
    if(d.ok==='1'&&canOpenAcad().ok){G.dinheiro-=25000;G.minha={nome,art:m.art,alunos:12,desde:G.ano};if(G.prof&&G.prof.art===m.art)G.prof=null;fixPlan();marco('Funda a academia '+nome);news(G.nome+' abre a própria academia: '+nome+'.');G.fama+=2}nextModal()},

let guardUntil=0,lastKey='',toastT=0;
const FEM=[[/\bEle\b/g,'Ela'],[/\bele\b/g,'ela'],[/\bdele\b/g,'dela'],[/Campeão/g,'Campeã'],[/campeão/g,'campeã'],[/novo campeã/g,'nova campeã'],[/Novo campeã/g,'Nova campeã'],
  [/Campeã respeitado/g,'Campeã respeitada'],[/Veterano/g,'Veterana'],[/Bem-vindo/g,'Bem-vinda'],[/Contratado/g,'Contratada'],[/dispensado/g,'dispensada'],[/Recuperado/g,'Recuperada'],

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const fn=ACTN[el.dataset.a];if(!fn)return;

/* ================= teste automático (carreiras simuladas) ================= */
function botPlan(){const mx=slotsMax();
  if(G.idade>=16&&Object.keys(G.artes).length<4&&G.dinheiro>2500&&R()<.3){const c=ART_IDS.filter(a=>!G.artes[a]);ACTN.matricular({art:pick(c)})}
  for(const id of Object.keys(G.artes)){const st=G.artes[id];st.t=0;for(let t=2;t>=1;t--)if(tierOk(id,t).ok&&G.dinheiro>ACAD[t].fee*6){st.t=t;break}}
  G.prepT=G.dinheiro>20000&&G.fama>=20?2:G.dinheiro>5000?1:0;
  G.plano={};if(profOn())G.plano.prof=1;const list=Object.keys(G.artes),tl=list.filter(teachLvl);
  if(tl.length&&R()<.5)G.plano['aula_'+pick(tl)]=1;
  if(G.minha&&R()<.6)G.plano.minha=1;
  if(!G.minha&&canOpenAcad().ok&&G.dinheiro>40000&&R()<.3){ACTN.abrirAcad();if(G.modal)ACTN.novaAcad({ok:'1'})}
  if(travelOf()&&R()<.5)ACTN.vaquinha();
  for(let i=usedSlots();i<mx;i++){const id=i===0?G.art0:(R()<.2?'prep':pick(list));G.plano[id]=(G.plano[id]||0)+1}
  if(!canAdvance().ok){for(const id of list)G.artes[id].t=0;G.prepT=0}
  if(!canAdvance().ok){G.plano={trab:mx-1};G.plano[G.art0]=1;fixPlan()}
  if(!canAdvance().ok){G.plano={trab:mx};fixPlan()}
  const opts=evOptions().filter(o=>o.ok);
  const ev=opts.find(o=>o.tipo==='mma'&&R()<.9)||opts.find(o=>o.tipo==='amador'&&R()<.25)||opts.find(o=>o.key.startsWith('X')&&R()<.3)||(G.idade>=19&&R()<.45&&opts.find(o=>o.tipo==='estreia'))||opts.find(o=>o.tipo==='torneio'&&R()<.85)||opts.find(o=>o.tipo==='none');
  G.ev=ev.key}
function botStep(){if(UI.view!=='game'){return 'fora'}
  if(G.modal){const m=G.modal;
    if(m.tipo==='classe')ACTN.classe({c:String(BIOS[G.bio].nat[G.sexo]+ri(-1,1)>=0?BIOS[G.bio].nat[G.sexo]:0)});
    else if(m.tipo==='promo')ACTN.promo({ok:R()<.85?'1':'0'});else if(m.tipo==='acad')ACTN.acad({i:R()<.7?String(ri(0,1)):''});else if(m.tipo==='equip')ACTN.equip({i:'0'});else if(m.tipo==='mestre')ACTN.mestre({c:pick(['pular','normal','segurar'])});else if(m.tipo==='nova')ACTN.novaAcad({ok:'1'});else if(m.tipo==='patro')ACTN.patro({i:R()<.8?String(ri(0,1)):''});
    else if(m.tipo==='fim')ACTN.fim();else if(m.tipo==='conf')ACTN.confFim();else ACTN.fechar();return 'modal'}
  switch(G.view){
    case 'hub':if(G.idade>=35&&R()<.08){ACTN.aposentar();return 'ret'}botPlan();ACTN.avancar();if(G.view==='hub'&&!G.modal){G.plano={trab:slotsMax()};fixPlan();G.ev='none';ACTN.avancar()}return 'hub';
    case 'pre':if(R()<.04)ACTN.desistir();else ACTN.competir();return 'pre';
    case 'fight':{const F=G.fight,S=F.S;if(S.end)ACTN.proxima({step:F.step});else if(S.mom){if(R()<.08)ACTN.simular({step:F.step});else{const info=momentInfo(S);ACTN.mom({id:R()<.6?aiMoment(S):pick(info).id,step:F.step})}}else ACTN.cont({step:F.step});return 'fight'}
    case 'result':ACTN.resfim();return 'res';
    case 'legacy':return 'done'}return '?'}
window.__bot={step:botStep,
  run(o){o=o||{};UI.bot=true;const d={nome:'Bot '+ri(1,999),ap:'',sexo:pick(['m','f']),bio:pick(Object.keys(BIOS)),orig:pick(Object.keys(ORIGENS)),art:o.art||pick(ART_IDS)};
    UI.draft=d;startCareer(d);UI.view='game';let steps=0,r;
    while(steps<(o.max||30000)){r=botStep();if(o.render!==false&&steps%(o.every||1)===0)render();steps++;if(r==='done')break}
    render();const M=G.mma;
    return {steps,fim:r,art:d.art,idade:G.idade,legado:G.legado,cartel:G.cartel,medalhas:G.trof.filter(t=>t.t==='med').length,
      circuitos:G.trof.filter(t=>t.tier>=4).map(t=>TIERS[t.tier].nome+':'+(t.metal+1)),ouroMundial:G.trof.filter(t=>t.t==='med'&&t.tier===3&&t.metal===0&&!t.juv).length,cinturoes:G.trof.filter(t=>t.t==='belt').map(b=>b.org+':'+b.def),
      org:M?M.org:null,graduacoes:Object.entries(G.artes).map(([k,s])=>k+':'+s.r),dinheiro:Math.round(G.dinheiro),fama:Math.round(G.fama),motivo:G.fimMotivo}}};
